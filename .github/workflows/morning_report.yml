tlabname: Generate Daily Market PDF

on:
  schedule:
    # Runs Sunday through Thursday at 23:13 UTC (6:13 AM Monday-Friday Thailand Time)
    - cron: '13 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write # Grants the cloud environment permission to save/push files back to your repo

jobs:
  run-analysis-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Generation Libraries
        run: |
          pip install yfinance google-genai fpdf2 reportlab

      # Runs the US Stock Market Analysis Script
      - name: Execute US Report Logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_market.py

      # NEW: Runs the Thai Stock Market Analysis Script
      - name: Execute Thai Report Logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_market_th.py

      # Commits and pushes both generated PDFs back to your repository safely
      - name: Commit and Push PDFs back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add morning_market_analysis.pdf thai_market_analysis.pdf
          
          # Only execute commit if structural modifications are detected
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Morning PDFs Update [skip ci]" && git push)
