name: US Market AI Analysis

on:
  workflow_dispatch:

permissions:
  contents: write # Grants the workflow permission to commit and push changes

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic yfinance fpdf2
          pip install git+https://github.com/twopirllc/pandas-ta.git

      - name: Run Market Analysis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python get_market_us.py

      - name: Commit and Push Generated PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add us_market_analysis.pdf
          git commit -m "Auto-generate latest market analysis PDF [skip ci]" || echo "No changes to commit"
          git push
