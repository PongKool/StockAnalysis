name: Run Thai Stock Analysis using Claude

on:
  workflow_dispatch: # Allows manual trigger from the "Actions" tab
  schedule:
    - cron: '0 0 * * 1-5' # Optional: Runs every Monday to Friday at midnight UTC

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install yfinance pandas reportlab; fi

      - name: Run Script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # If your script uses the Claude API
        run: |
          python get_market_th_claude.py

      - name: Commit and Push Results (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add thai_market_analysis_claude.pdf
          git commit -m "Auto-generated stock analysis PDF [skip ci]" || exit 0
          git push
