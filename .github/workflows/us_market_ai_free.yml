name: US Market AI Free Analysis

on:
  workflow_dispatch: # Allows manual trigger from the GitHub "Actions" tab

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic yfinance fpdf2

      - name: Run Market Analysis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_FREE }}
        run: |
          python get_us_market_free.py

      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: us-market-ai-report
          path: us_market_ai_free.pdf
          retention-days: 7
