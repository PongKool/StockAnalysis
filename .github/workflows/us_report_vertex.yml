name: US Market Analysis Vertex Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-us-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance fpdf2 pandas pandas-ta google-genai

      - name: Execute US Market Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_market_vertex_us.py

      - name: Commit and Push Generated PDF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git stash
          git pull origin main --rebase
          git stash pop || true
          git add us_market_analysis.pdf
          git commit -m "Automated US PDF Update [skip ci]" || exit 0
          git push origin main
